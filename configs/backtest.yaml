backtest:
  mode: "base"   # base | smc_fvg_confluence
  
  thresholds:
    up: 0.55
    down: 0.55
    neutral_band: 0.05
    
  confluence:
    enabled: false
    htf_bias_tf: ["4H", "1D"]
    ltf_confirm_tf: ["15m"]
    max_dist_fvg_pips: 5
    choch_bos_lookback_bars: 20
    ob_mitigation_lookback_bars: 60
    require_all: false  # Require all conditions or any
    
  costs:
    spread_pips: 0.8
    commission_pct: 0.0
    slippage_pips: 0.3
    
  risk:
    position_size_pct: 1.0
    max_positions: 1
    
  metrics:
    - sharpe_ratio
    - sortino_ratio
    - calmar_ratio
    - max_drawdown
    - total_pnl
    - win_rate
    - profit_factor
